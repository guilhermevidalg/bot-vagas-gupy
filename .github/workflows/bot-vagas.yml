# Execução diária do bot: busca as vagas, envia as novas no Telegram e salva o banco.
name: Bot de vagas

on:
  schedule:
    # Todo dia às 11:17 UTC = 08:17 em Brasília (minuto "quebrado": nas horas cheias o
    # GitHub fica sobrecarregado e atrasa as execuções agendadas)
    - cron: "17 11 * * *"
  workflow_dispatch: # botão "Run workflow" na aba Actions, para rodar na hora

# Permite que o workflow faça commit do dados/vagas.db
permissions:
  contents: write

# Nunca duas execuções ao mesmo tempo mexendo no mesmo banco
concurrency:
  group: bot-vagas
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # se travar, para sozinho
    steps:
      - name: Baixar o repositório (inclui o dados/vagas.db)
        uses: actions/checkout@v7

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes (se falharem, o bot nem roda)
        run: pytest -q

      - name: Rodar o bot
        env:
          # Os valores vêm dos Secrets do repositório; o GitHub esconde no log
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_vagas.main

      - name: Salvar o banco no repositório (só se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/vagas.db
          # "diff --cached --quiet" dá certo quando NÃO há mudança: aí não commita
          if git diff --cached --quiet; then
            echo "Nenhuma vaga nova para salvar."
            exit 0
          fi
          git commit -m "Atualiza vagas vistas ($(TZ=America/Sao_Paulo date +%F))"
          git pull --rebase   # caso alguém tenha feito push enquanto o bot rodava
          git push
